<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hanbo Song</title>
    <link rel="stylesheet" href="style.css">
    <script src="blog_data.js"></script>
</head>

<body>
    <header>
        <nav class="animate-in delay-1">
            <div class="nav-content">
                <ul>
                    <li><a href="index.html">Hanbo Song</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="index.html#interviews">Interviews</a></li>
                    <li><a href="index.html#gallery">Gallery</a></li>
                    <li><a href="index.html#contact">Contact Me</a></li>
                </ul>
            </div>
        </nav>
        <div class="blog-container single-post-container animate-in delay-2">
            <div id="singlePostContent">
                <!-- Post content injected here -->
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <h3>Delete post?</h3>
                <p>This can't be undone and it will be removed from your profile and the timeline of any accounts that
                    follow you.</p>
                <div class="modal-actions">
                    <button class="modal-btn cancel" id="cancelDelete">Cancel</button>
                    <button class="modal-btn delete" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const container = document.getElementById('singlePostContent');
            const isAdmin = urlParams.get('admin') === 'true';

            // Modal Elements
            const modal = document.getElementById('deleteModal');
            const cancelBtn = document.getElementById('cancelDelete');
            const confirmBtn = document.getElementById('confirmDelete');

            // Modal Event Listeners
            cancelBtn.addEventListener('click', closeModal);
            window.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            confirmBtn.addEventListener('click', () => {
                if (postId) {
                    deletePost(postId);
                }
            });

            function openDeleteModal() {
                modal.style.display = 'flex';
            }

            function closeModal() {
                modal.style.display = 'none';
            }

            function deletePost(id) {
                let localPosts = JSON.parse(localStorage.getItem('blog_posts') || '[]');
                const isLocal = localPosts.some(p => p.id == id);
                if (isLocal) {
                    localPosts = localPosts.filter(p => p.id != id);
                    localStorage.setItem('blog_posts', JSON.stringify(localPosts));
                } else {
                    const deletedIds = JSON.parse(localStorage.getItem('deleted_static_posts') || '[]');
                    const numId = Number(id);
                    if (!deletedIds.includes(numId)) {
                        deletedIds.push(numId);
                        localStorage.setItem('deleted_static_posts', JSON.stringify(deletedIds));
                    }
                }
                window.location.href = 'blog.html' + (isAdmin ? '?admin=true' : '');
            }

            if (!postId) {
                container.innerHTML = '<p>Post not found.</p>';
                return;
            }

            const staticPosts = typeof STATIC_BLOG_POSTS !== 'undefined' ? STATIC_BLOG_POSTS : [];
            const localPosts = JSON.parse(localStorage.getItem('blog_posts') || '[]');
            
            const allPostsMap = new Map();
            staticPosts.forEach(p => allPostsMap.set(p.id, p));
            localPosts.forEach(p => allPostsMap.set(p.id, p));
            
            const deletedIds = JSON.parse(localStorage.getItem('deleted_static_posts') || '[]');
            const post = Array.from(allPostsMap.values())
                .filter(p => !deletedIds.includes(p.id))
                .find(p => p.id == postId);

            if (post) {
                const date = new Date(post.timestamp).toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });

                const deleteBtnHTML = isAdmin ? `
                    <button class="delete-btn" id="singlePostDeleteBtn" title="Delete post">
                        <img src="Images/delete_icon.png" alt="Delete">
                    </button>
                ` : '';

                container.innerHTML = `
                    <article class="blog-post full-post">
                        <div class="post-header-full">
                            <div class="post-meta">
                                <span class="post-author-name">${post.author}</span>
                                <span class="post-timestamp">${date}</span>
                            </div>
                            ${deleteBtnHTML}
                        </div>
                        ${post.title ? `<h1 class="post-title-full">${post.title}</h1>` : ''}
                        <div class="post-body-full">
                            ${post.content}
                        </div>
                        ${post.media ? renderMedia(post) : ''}
                    </article>
                `;

                if (isAdmin) {
                    document.getElementById('singlePostDeleteBtn').addEventListener('click', openDeleteModal);
                }
            } else {
                container.innerHTML = '<p>Post not found.</p>';
            }
        });

        function renderMedia(post) {
            if (post.mediaType === 'video') {
                return `<div class="post-media-full"><video controls src="${post.media}" style="width:100%; border-radius: 16px;"></video></div>`;
            } else if (post.mediaType === 'pdf') {
                return `
                    <div class="post-media-full">
                        <a href="${post.media}" download="${post.mediaName}" class="pdf-attachment">
                            📄 ${post.mediaName || 'Document.pdf'}
                        </a>
                    </div>`;
            } else {
                return `<div class="post-media-full"><img src="${post.media}" alt="Post media"></div>`;
            }
        }
    </script>
</body>

</html>
